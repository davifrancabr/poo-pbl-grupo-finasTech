<hr>
     <section id="home" class="mt-5" style="height: 620px;">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6">
                <div id="caixa-login" class="text-center">
                    <h2 class="display-4"><b>Entrar na sua conta Finans</b></h2>

                    <form class="mt-5" id="form-login">
    
              <div class="form-group mb-3">
                  <input 
                      type="email" 
                      class="form-control" 
                      id="usuario" 
                      placeholder="Digite seu e-mail"
                      required>
              </div>

              <div class="form-inline form-group d-flex align-items-center">
                  <input 
                      type="password" 
                      class="form-control me-2" 
                      id="senha" 
                      placeholder="Digite sua senha"
                      required>

                  <button 
                      type="submit" 
                      class="btn btn-primary ms-1">
                      Logar
                  </button>

                  <div class="form-check ms-3 ml-1">
                      <input 
                          class="form-check-input" 
                          type="checkbox" 
                          id="lembrar"
                          checked>
                      <label class="form-check-label" for="lembrar">
                          Lembre-me
                      </label>
                  </div>
              </div>

              <div class="text-center mt-3">
                  <a href="#">Esqueceu sua senha?</a>
              </div>

          </form>
                    <hr>
                    <div class="text-center">
                        <p>
                            Não tem conta? <a href=''>
                                Cadastra-se agora
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
