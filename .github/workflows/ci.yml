name: CI

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck domain and API
        run: npm run build:domain

      - name: Build API
        run: npm run build:api

      - name: Build FrontEnd
        run: npm run build:web

      - name: Run unit tests
        run: npm test

        env:
          USE_MEMORY_DB: "true"
